# Base folder for generated frames and downloaded Roboflow datasets.
DATA_FOLDER: "./data/"

# Object detection pipeline (train_yolo.py). Turn each step on/off below.
# Step 1: create synthetic frames from robosuite.
GENERATE_DATASET: false
# Step 2: download the labeled dataset from Roboflow.
DOWNLOAD_DATASET: true
# Step 3: train the YOLO model.
TRAIN_YOLO: true
# Step 4: test the model, export to ONNX if it passes.
EVAL_YOLO: true

# Pose estimation pipeline (train_pose.py). Turn each step on/off below.
# Step 1: build the pose dataset from robosuite + YOLO.
GENERATE_POSE_DATASET: false
# Step 2: train the PoseEstimator model.
TRAIN_POSE_ESTIMATOR: true
# Step 3: test the model, export to ONNX if it passes.
EVAL_POSE_ESTIMATOR: true

ENVIRONMENT:
  # XYZ offset applied to the Panda robot's base position in the simulation.
  # Must match the offset used by the robot that will run the exported model.
  ROBOT_BASE_OFFSET: [0.10, 0.10, 0.0]

# Roboflow workspace/project the dataset is downloaded from (see
# DOWNLOAD_DATASET above). The dataset is public, so any valid Roboflow API
# key can download it, even from a different account.
ROBOFLOW:
  # Roboflow workspace name.
  WORKSPACE_NAME: "anouk-okkema"
  # Roboflow project name.
  PROJECT_NAME: "robosuite-pickplace-object-detection-synthetic"
  # Local folder name the dataset is saved under.
  DATASET_FOLDER_NAME: "PickPlace Vision Dataset"
  # Dataset version to download.
  VERSION_NUMBER: 1
  # Annotation format the dataset is downloaded in.
  MODEL_FORMAT: "yolov8"

YOLO:
  # Base model training starts from.
  MODEL_NAME: "yolov8n.pt"
  # Training epoch count.
  EPOCHS: 100
  # Training image resolution, in pixels.
  IMAGE_SIZE: 640
  # Training batch size.
  BATCH_SIZE: 16
  # Epochs to wait with no improvement before stopping early.
  PATIENCE: 30
  # Ultralytics run folder name.
  PROJECT_NAME: "robosuite-pickplace-vision"
  # Name of this specific run, within PROJECT_NAME.
  RUN_NAME: "yolov8n-baseline-v1"
  # Minimum mAP50-95 score, on the test set, needed to export to ONNX.
  EXPORT_ONNX_THRESHOLD: 0.8
  # Filename the exported ONNX model is saved as.
  EXPORT_ONNX_NAME: "yolo_detector.onnx"

# Turns off Ultralytics' own experiment trackers. We log to W&B ourselves
# instead (see YOLOWandBCallback), so these should stay false.
ULTRALYTICS:
  wandb: false
  tensorboard: false
  mlflow: false
  comet: false
  clearml: false

POSE:
  # Ultralytics-style run folder name for the pose pipeline.
  PROJECT_NAME: "robosuite-pickplace-pose"
  # Name of this specific run, within PROJECT_NAME.
  RUN_NAME: "pose-estimator-baseline-v1"
  # Path to the generated pose dataset. Shared between train and eval.
  POSE_DATASET_PATH: "./data/pose_dataset.pkl"
  # Path the best training checkpoint is saved to and loaded from.
  CHECKPOINT_PATH: "./runs/pose_estimator/best.pt"
  # Output path for the exported ONNX model.
  ONNX_EXPORT_PATH: "./runs/pose_estimator/pose_estimator.onnx"
  # Number of frames the pose dataset generator creates.
  NUM_DATASET_IMAGES: 4000
  # Input size for the position stream (full scene).
  POS_IMAGE_SIZE: 320
  # Input size for the rotation stream (object crop).
  ROTATION_IMAGE_SIZE: 128
  # Dropout rate used in the class processor and rotation head.
  DROPOUT: 0.3
  # Training batch size.
  BATCH_SIZE: 16
  # Maximum training epoch count.
  EPOCHS: 200
  # Optimizer learning rate.
  LEARNING_RATE: 0.0001
  # Epochs to wait for val_loss to improve before stopping early.
  # 0 or null disables early stopping (always runs all EPOCHS).
  EARLY_STOPPING_PATIENCE: 20
  # Fraction of the dataset held out for validation.
  VAL_SPLIT: 0.15
  # Fraction of the dataset held out for testing.
  TEST_SPLIT: 0.15
  # How much the rotation loss counts, relative to the position loss.
  ROTATION_LOSS_WEIGHT: 1.0

  # The model is only exported to ONNX if every class's mean position error
  # (cm) AND rotation error (below) both meet their threshold. An average
  # across classes is not enough, since it can hide one weak class (see
  # xyz_r2 note in the README).
  EXPORT_POSITION_THRESHOLD_CM: 1.0
  EXPORT_ROTATION_THRESHOLD_DEG: 5.0

  # Classes that look the same at any rotation. A can looks and grasps the
  # same no matter how it's turned, so it has no real "correct" rotation to
  # learn from. These classes are left out of the rotation loss, the
  # rotation metric, and the rotation part of the export check above. Their
  # position is still scored normally. See the README for the full reason.
  ROTATION_SYMMETRIC_CLASSES: ["Can"]

[project]
name = "dev-robot-pickplace-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "mujoco==3.3.0",
    "onnx>=1.21.0",
    "onnxslim>=0.1.95",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "roboflow>=1.3.7",
    "robosuite>=1.5.2",
    "robosuite-models>=1.0.0",
    "ultralytics>=8.0.196",
    "wandb>=0.26.1",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
    "onnxruntime>=1.20.0",
]
mps = [
    "torch",
    "torchvision",
    "onnxruntime>=1.20.0",
]
gpu = [
    "torch",
    "torchvision",
    "onnxruntime-gpu>=1.26.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "mps" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# mps: geen expliciete index -> valt terug op PyPI, waar de macOS-wheel
# native MPS-ondersteuning bevat (PyTorch's eigen indexes leveren geen macOS-wheels).
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "gpu" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
]
